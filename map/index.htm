<!DOCTYPE html>
<html>
<head>
<title>Map</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="search" href="opensearch.xml" type="application/opensearchdescription+xml" title="Map">
<script>
if (window.location.search.startsWith('?place='))
{
	window.location.hash = '#' + window.location.search.substr(1);
	window.location.search = '';
}
</script>
<script src="leaflet/leaflet.js"></script>
<link href="leaflet/leaflet.css" rel="stylesheet">

<script src="leaflet/leaflet-search.js"></script>
<link href="leaflet/leaflet-search.css" rel="stylesheet">

<script src="leaflet/L.Control.Locate.js"></script>
<script src="leaflet/locator.js"></script>

<script src="leaflet/leaflet.measure.js"></script>
<link href="leaflet/leaflet.measure.css" rel="stylesheet">

<script src="leaflet/togeojson.js"></script>
<script src="leaflet/leaflet.filelayer.js"></script>

<script src="leaflet/leaflet.markercluster.js"></script>
<link href="leaflet/leaflet.markercluster.css" rel="stylesheet">

<script src="leaflet/leaflet.photo.js"></script>
<link href="leaflet/leaflet.photo.css" rel="stylesheet">

<script src="leaflet/leaflet.commons.js"></script>
<link href="leaflet/leaflet.commons.css" rel="stylesheet">

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCt-iKtoOCPEyWa8pe0nMABxUXE7ofedvo"></script>
<script src="leaflet/leaflet.googlemutant.js"></script>

<link rel="stylesheet" href="leaflet/leaflet.contextmenu.min.css">
<script src="leaflet/leaflet.contextmenu.min.js"></script>

<link rel="stylesheet" href="leaflet/leaflet-routing-machine.css">
<script src="leaflet/leaflet-routing-machine.js"></script>

<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="dark.css" media="(prefers-color-scheme: dark)">
</head>
<body>

<div class="streetview-container"><iframe></iframe><div class="resizer"></div></div>
<div class="streetview-close" title="Close Streetview"></div>

<div id="map" class="map">
	<div class="sidepanel sidepanel-hiking">
		<div class="heading">Hiking routes</div>
		<ul data-flavor="hiking"></ul>
	</div>
	<div class="sidepanel sidepanel-cycling" style="display:none">
		<div class="heading">Cycling routes</div>
		<ul data-flavor="cycling"></ul>
	</div>
</div>

<iframe class="wmt"></iframe>
<button class="wmt"></button>

<script src="main.js"></script>
</body>
</html>

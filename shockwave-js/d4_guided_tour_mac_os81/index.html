<!DOCTYPE html>
<html lang="en-us">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Director 4.0 - Guided Tour</title>
<script src="enable-threads.js"></script>
<style>
body {
    font-family: arial;
    margin: 0;
    padding: none;
    background-color: #333;
    color: white;
}
small, small a {
    color: #999;
}
.emscripten {
    padding-right: 0;
    margin-left: auto;
    margin-right: auto;
    display: block;
}
div.emscripten {
    text-align: center;
}
div.emscripten_border {
    border: 1px solid black;
}
/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
canvas.emscripten {
    border: 0px none;
    background-color: black;
    cursor: none;
}
h1 {
    font-size: 28px;
    padding:20px 0;
}
.main {
    width: 640px;
    margin: 1em auto;
}
@keyframes blinker {
    50% {
      opacity: 0;
    }
}
#loading {
	padding-top:20px;
}
#loading .text {
    animation: blinker 1s linear infinite;
    display: none;
}
.loading #loading .text {
    padding-top: 8px;
    display: block;
}
</style>
</head>
<body>
<div class="main">
<h1>Director 4.0 - Guided Tour</h1>

<canvas width="640" height="480" class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<small>Based on <a href="https://github.com/jsdf/macemu">https://github.com/jsdf/macemu</a></small>

<div id="loading" class="hide-on-incompatible">
<span class="text">Loading...</span>
<progress value="0" max="1" id="progress" hidden=""></progress>
</div>

</div>

<script type="text/javascript">
window.basiliskConfig = {
    singleThreadedEmscripten: true,
    baseURL: '',
    autoloadFiles: [
        'resources/20mb-en.dsk',
        'Quadra-650.rom',
        'prefs',
    ],
    arguments: ['--config', 'prefs'],
};
var progressElement = document.getElementById('progress');
</script>
<script src="BasiliskII-worker-ui-thread.js"></script>
</body>
</html>
